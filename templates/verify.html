{% extends 'base.html' %}{% block title %}Verify your email{% endblock %}
{% block content %}<section class="form-center container"><div class="form-card"><span class="kicker">SECURE VERIFICATION</span><h1>Check your <em>inbox.</em></h1><p>Enter the six-digit code sent to your registered email. It expires after 10 minutes and can be used only once.</p>{% if error %}<div class="notice error">{{error}}</div>{% endif %}<form method="post" action="/verify/{{purpose}}"><input type="hidden" name="csrf" value="{{csrf}}"><label>Verification code<input class="code-field" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code" placeholder="000000"></label><button type="submit" class="btn primary block">Verify and continue <span>→</span></button></form><form method="post" action="/resend/{{purpose}}" class="resend"><input type="hidden" name="csrf" value="{{csrf}}"><button type="submit">Resend code (after 60 seconds)</button></form></div></section>{% endblock %}
